<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Mobola Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    nav {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem 2rem;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .admin-header h1 {
      color: #667eea;
      margin: 0;
      font-size: 1.8rem;
    }

    .logout-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
    }

    .passcode-container {
      max-width: 450px;
      margin: 5rem auto;
      padding: 3rem;
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .passcode-container h2 {
      color: #667eea;
      margin-bottom: 0.5rem;
      text-align: center;
      font-size: 1.8rem;
    }

    .passcode-container p {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
    }

    .passcode-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .passcode-input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      letter-spacing: 2px;
      text-align: center;
      background: #f8f9fa;
      transition: all 0.3s ease;
    }

    .passcode-input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .toggle-passcode {
      position: absolute;
      right: 15px;
      background: none;
      border: none;
      cursor: pointer;
      color: #667eea;
      font-size: 1.1rem;
      padding: 5px;
      transition: all 0.3s ease;
    }

    .toggle-passcode:hover {
      color: #764ba2;
      transform: scale(1.1);
    }

    .btn-unlock {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-unlock:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .error-message {
      color: #d32f2f;
      background-color: #ffebee;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      border-left: 4px solid #d32f2f;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid #e0e0e0;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 0.8rem 1.5rem;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #666;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tab-btn:hover {
      color: #667eea;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .tab-content.active {
      display: block;
    }

    .tab-content h2 {
      color: #333;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Product Form */
    .product-form {
      background: #f8f9fa;
      padding: 2rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }

    .file-input-label {
      display: block;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .file-input-label:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .image-preview {
      margin-top: 1rem;
      text-align: center;
    }

    .image-preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .btn-submit {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    /* Products List */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .product-card {
      background: #f8f9fa;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #e0e0e0;
    }

    .product-info {
      padding: 1.5rem;
    }

    .product-name {
      font-weight: bold;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .product-price {
      color: #667eea;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .product-category {
      color: #666;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-small {
      flex: 1;
      padding: 0.6rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s ease;
    }

    .btn-edit {
      background: #667eea;
      color: white;
    }

    .btn-edit:hover {
      background: #764ba2;
    }

    .btn-delete {
      background: #ff6b6b;
      color: white;
    }

    .btn-delete:hover {
      background: #ff5252;
    }

    .btn-toggle {
      background: #ffc107;
      color: white;
    }

    .btn-toggle:hover {
      background: #e0a800;
    }

    /* Order & User Cards */
    .order-card {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border-left: 4px solid #667eea;
      transition: all 0.3s ease;
    }

    .order-card:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .order-card h3 {
      margin-top: 0;
      color: #333;
      margin-bottom: 1rem;
    }

    .order-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .order-details p {
      margin: 0.5rem 0;
    }

    .order-details strong {
      color: #667eea;
    }

    .status-badge {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .status-pending {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-confirmed {
      background-color: #d4edda;
      color: #155724;
    }

    .status-failed {
      background-color: #f8d7da;
      color: #721c24;
    }

    .action-buttons {
      display: flex;
      gap: 0.8rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn-action {
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn-confirm {
      background: #25d366;
      color: white;
    }

    .btn-confirm:hover {
      background: #128c7e;
    }

    .btn-pending {
      background: #ffc107;
      color: white;
    }

    .btn-pending:hover {
      background: #e0a800;
    }

    .btn-fail {
      background: #ff6b6b;
      color: white;
    }

    .btn-fail:hover {
      background: #ff5252;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .users-table thead {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .users-table th,
    .users-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    .users-table tbody tr:hover {
      background: #f8f9fa;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #666;
      margin-top: 4rem;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .order-details {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .admin-header {
        flex-direction: column;
        gap: 1rem;
      }

      .admin-header h1 {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Store</a>
  </nav>

  <!-- Passcode Login -->
  <div id="passcode-section" class="passcode-container">
    <h2><i class="fas fa-lock"></i> Admin Dashboard</h2>
    <p>Enter the admin passcode to access</p>
    <div id="error-message" class="error-message"></div>
    <div class="passcode-wrapper">
      <input type="password" id="passcode" class="passcode-input" placeholder="Enter passcode" autocomplete="off">
      <button type="button" class="toggle-passcode" id="toggle-passcode">
        <i class="fas fa-eye"></i>
      </button>
    </div>
    <button class="btn-unlock" onclick="unlockAdmin()"><i class="fas fa-unlock"></i> Unlock</button>
  </div>

  <!-- Admin Dashboard -->
  <div id="admin-section" style="display: none;">
    <div class="admin-container">
      <div class="admin-header">
        <h1><i class="fas fa-chart-line"></i> Admin Dashboard</h1>
        <button class="logout-btn" onclick="logoutAdmin()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('products')"><i class="fas fa-box"></i> Products</button>
        <button class="tab-btn" onclick="switchTab('orders')"><i class="fas fa-shopping-cart"></i> Orders</button>
        <button class="tab-btn" onclick="switchTab('users')"><i class="fas fa-users"></i> Users</button>
      </div>

      <!-- Products Tab -->
      <div id="products" class="tab-content active">
        <h2><i class="fas fa-plus-circle"></i> Add New Product</h2>
        <div class="product-form">
          <form id="product-form" onsubmit="addProduct(event)">
            <div class="form-row">
              <div class="form-group">
                <label for="product-name">Product Name</label>
                <input type="text" id="product-name" required placeholder="e.g., Kitchen Pot">
              </div>
              <div class="form-group">
                <label for="product-category">Category</label>
                <select id="product-category" required>
                  <option value="">Select Category</option>
                  <option value="Kitchen">Kitchen Utensil</option>
                  <option value="Snacks">Snacks</option>
                  <option value="Foodstuff">Foodstuff</option>
                  <option value="Drinks">Zobo Drink</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="product-price">Price (₦)</label>
                <input type="number" id="product-price" required placeholder="5000" min="0">
              </div>
              <div class="form-group">
                <label for="product-image">Product Image</label>
                <div class="file-input-wrapper">
                  <input type="file" id="product-image" accept="image/*" required>
                  <label for="product-image" class="file-input-label">
                    <i class="fas fa-cloud-upload-alt"></i> Click to upload image
                  </label>
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="product-description">Description</label>
              <textarea id="product-description" placeholder="Product description..."></textarea>
            </div>

            <div class="image-preview" id="image-preview" style="display: none;">
              <img id="preview-img" src="" alt="Preview">
            </div>

            <button type="submit" class="btn-submit"><i class="fas fa-save"></i> Add Product</button>
          </form>
        </div>

        <h2 style="margin-top: 2rem;"><i class="fas fa-list"></i> All Products</h2>
        <div id="products-container" class="loading">
          <div class="spinner"></div>
          <p>Loading products...</p>
        </div>
      </div>

      <!-- Orders Tab -->
      <div id="orders" class="tab-content">
        <h2><i class="fas fa-shopping-cart"></i> Order Management</h2>
        <div id="orders-container" class="loading">
          <div class="spinner"></div>
          <p>Loading orders...</p>
        </div>
      </div>

      <!-- Users Tab -->
      <div id="users" class="tab-content">
        <h2><i class="fas fa-users"></i> Registered Users</h2>
        <div id="users-container" class="loading">
          <div class="spinner"></div>
          <p>Loading users...</p>
        </div>
      </div>
    </div>
  </div>

  <footer><p>&copy; 2026 Mobola Stores. All rights reserved.</p></footer>

  <script>
    // Toggle passcode visibility
    const togglePasscodeBtn = document.getElementById('toggle-passcode');
    const passcodeInput = document.getElementById('passcode');

    togglePasscodeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (passcodeInput.type === 'password') {
        passcodeInput.type = 'text';
        togglePasscodeBtn.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        passcodeInput.type = 'password';
        togglePasscodeBtn.innerHTML = '<i class="fas fa-eye"></i>';
      }
    });

    // Image preview
    document.getElementById('product-image').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const preview = document.getElementById('image-preview');
          const img = document.getElementById('preview-img');
          img.src = event.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Check if admin is already authenticated
    async function checkAdminStatus() {
      try {
        const response = await fetch('/api/admin/check');
        const data = await response.json();
        if (data.authenticated) {
          showAdminDashboard();
          loadProducts();
          loadOrders();
          loadUsers();
        }
      } catch (error) {
        console.error('Error checking admin status:', error);
      }
    }

    // Unlock admin dashboard with passcode
    async function unlockAdmin() {
      const passcode = document.getElementById('passcode').value;
      const errorDiv = document.getElementById('error-message');

      if (!passcode) {
        errorDiv.textContent = 'Please enter the passcode';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ passcode })
        });

        const data = await response.json();

        if (response.ok) {
          showAdminDashboard();
          loadProducts();
          loadOrders();
          loadUsers();
        } else {
          errorDiv.textContent = data.error || 'Invalid passcode. Please try again.';
          errorDiv.style.display = 'block';
        }
      } catch (error) {
        console.error('Admin login error:', error);
        errorDiv.textContent = 'Connection error. Please check your internet and try again.';
        errorDiv.style.display = 'block';
      }
    }

    // Show admin dashboard
    function showAdminDashboard() {
      document.getElementById('passcode-section').style.display = 'none';
      document.getElementById('admin-section').style.display = 'block';
    }

    // Switch between tabs
    function switchTab(tabName) {
      const tabs = document.querySelectorAll('.tab-content');
      const buttons = document.querySelectorAll('.tab-btn');

      tabs.forEach(tab => tab.classList.remove('active'));
      buttons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'products') {
        loadProducts();
      } else if (tabName === 'orders') {
        loadOrders();
      } else if (tabName === 'users') {
        loadUsers();
      }
    }

    // Add new product
    async function addProduct(event) {
      event.preventDefault();

      const formData = new FormData();
      formData.append('name', document.getElementById('product-name').value);
      formData.append('category', document.getElementById('product-category').value);
      formData.append('price', document.getElementById('product-price').value);
      formData.append('description', document.getElementById('product-description').value);
      formData.append('image', document.getElementById('product-image').files[0]);

      try {
        const response = await fetch('/api/admin/products', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          alert('Product added successfully!');
          document.getElementById('product-form').reset();
          document.getElementById('image-preview').style.display = 'none';
          loadProducts();
        } else {
          alert(data.error || 'Failed to add product');
        }
      } catch (error) {
        alert('An error occurred');
        console.error('Error adding product:', error);
      }
    }

    // Load all products
    async function loadProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading products...</p></div>';

      try {
        const response = await fetch('/api/admin/products');
        const products = await response.json();

        if (products.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">No products yet</p>';
          return;
        }

        let html = '<div class="products-grid">';
        products.forEach(product => {
          html += `
            <div class="product-card">
              <img src="${product.image_url}" alt="${product.name}" class="product-image">
              <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-category">${product.category}</div>
                <div class="product-price">₦${product.price.toLocaleString()}</div>
                <div class="product-actions">
                  <button class="btn-small btn-edit" onclick="editProduct(${product.id})"><i class="fas fa-edit"></i> Edit</button>
                  <button class="btn-small btn-toggle" onclick="toggleProduct(${product.id}, ${product.is_available})"><i class="fas fa-${product.is_available ? 'eye-slash' : 'eye'}"></i></button>
                  <button class="btn-small btn-delete" onclick="deleteProduct(${product.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </div>
            </div>
          `;
        });
        html += '</div>';

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = '<p style="color: #ff4444;">Error loading products</p>';
        console.error('Error loading products:', error);
      }
    }

    // Delete product
    async function deleteProduct(productId) {
      if (!confirm('Are you sure you want to delete this product?')) return;

      try {
        const response = await fetch(`/api/admin/products/${productId}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          alert('Product deleted successfully!');
          loadProducts();
        } else {
          alert('Failed to delete product');
        }
      } catch (error) {
        alert('An error occurred');
        console.error('Error deleting product:', error);
      }
    }

    // Toggle product availability
    async function toggleProduct(productId, currentStatus) {
      try {
        const response = await fetch(`/api/admin/products/${productId}/toggle`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ is_available: !currentStatus })
        });

        if (response.ok) {
          alert(`Product ${!currentStatus ? 'enabled' : 'disabled'} successfully!`);
          loadProducts();
        } else {
          alert('Failed to update product');
        }
      } catch (error) {
        alert('An error occurred');
        console.error('Error toggling product:', error);
      }
    }

    // Load all orders
    async function loadOrders() {
      const container = document.getElementById('orders-container');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading orders...</p></div>';

      try {
        const response = await fetch('/api/admin/orders');
        const orders = await response.json();

        if (orders.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">No orders yet</p>';
          return;
        }

        let html = '';
        orders.forEach(order => {
          const statusClass = `status-${order.status}`;
          html += `
            <div class="order-card">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                  <h3><i class="fas fa-box"></i> Order #${order.order_number}</h3>
                  <span class="status-badge ${statusClass}"><i class="fas fa-circle"></i> ${order.status.toUpperCase()}</span>
                </div>
              </div>
              <div class="order-details">
                <p><strong>Customer:</strong> ${order.customer_name}</p>
                <p><strong>Email:</strong> ${order.customer_email}</p>
                <p><strong>Phone:</strong> ${order.customer_phone}</p>
                <p><strong>Total:</strong> ₦${order.total_amount.toLocaleString()}</p>
              </div>
              <p><strong>Delivery Address:</strong> ${order.delivery_address}</p>
              ${order.notes ? `<p><strong>Notes:</strong> ${order.notes}</p>` : ''}
              <div class="action-buttons">
                <button class="btn-action btn-confirm" onclick="updateOrderStatus(${order.id}, 'confirmed')"><i class="fas fa-check"></i> Confirm</button>
                <button class="btn-action btn-pending" onclick="updateOrderStatus(${order.id}, 'pending')"><i class="fas fa-hourglass"></i> Pending</button>
                <button class="btn-action btn-fail" onclick="updateOrderStatus(${order.id}, 'failed')"><i class="fas fa-times"></i> Fail</button>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = '<p style="color: #ff4444;">Error loading orders</p>';
        console.error('Error loading orders:', error);
      }
    }

    // Update order status
    async function updateOrderStatus(orderId, status) {
      try {
        const response = await fetch(`/api/admin/orders/${orderId}/status`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Order status updated! Customer has been notified via email.');
          loadOrders();
        } else {
          alert(data.error || 'Failed to update order status');
        }
      } catch (error) {
        alert('An error occurred');
        console.error('Error updating order status:', error);
      }
    }

    // Load all users
    async function loadUsers() {
      const container = document.getElementById('users-container');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading users...</p></div>';

      try {
        const response = await fetch('/api/admin/users');
        const users = await response.json();

        if (users.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">No users yet</p>';
          return;
        }

        let html = `
          <table class="users-table">
            <thead>
              <tr>
                <th><i class="fas fa-user"></i> Name</th>
                <th><i class="fas fa-envelope"></i> Email</th>
                <th><i class="fas fa-phone"></i> Phone</th>
                <th><i class="fas fa-calendar"></i> Joined</th>
              </tr>
            </thead>
            <tbody>
        `;

        users.forEach(user => {
          const joinDate = new Date(user.created_at).toLocaleDateString();
          html += `
            <tr>
              <td>${user.name}</td>
              <td>${user.email}</td>
              <td>${user.phone || 'N/A'}</td>
              <td>${joinDate}</td>
            </tr>
          `;
        });

        html += `
            </tbody>
          </table>
        `;

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = '<p style="color: #ff4444;">Error loading users</p>';
        console.error('Error loading users:', error);
      }
    }

    // Logout admin
    async function logoutAdmin() {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        document.getElementById('passcode-section').style.display = 'block';
        document.getElementById('admin-section').style.display = 'none';
        document.getElementById('passcode').value = '';
      } catch (error) {
        console.error('Error logging out:', error);
      }
    }

    // Check admin status on page load
    window.addEventListener('load', checkAdminStatus);

    // Allow Enter key to unlock
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && document.getElementById('passcode-section').style.display !== 'none') {
        unlockAdmin();
      }
    });
  </script>
</body>
</html>
