<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Mobola Store</title>
  <link rel="stylesheet" href="/design/new.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .auth-container h1 {
      text-align: center;
      color: #25d366;
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #25d366;
      box-shadow: 0 0 5px rgba(37, 211, 102, 0.3);
    }

    .btn-signup {
      width: 100%;
      padding: 12px;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-signup:hover {
      background-color: #128c7e;
    }

    .btn-signup:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .auth-link {
      text-align: center;
      margin-top: 1rem;
      color: #666;
    }

    .auth-link a {
      color: #25d366;
      text-decoration: none;
      font-weight: bold;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #ff4444;
      background-color: #ffe6e6;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message {
      color: #25d366;
      background-color: #e6ffe6;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .back-link {
      text-align: center;
      margin-bottom: 1rem;
    }

    .back-link a {
      color: #25d366;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="nav-right">
    <a href="/HTML/index.html">Home</a>
    <a href="/HTML/shop.html">Shop</a>
    <a href="/HTML/contact.html">Contact</a>
  </nav>

  <div class="auth-container">
    <div class="back-link">
      <a href="/HTML/index.html">← Back to Home</a>
    </div>

    <h1>📝 Create Account</h1>

    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <form id="signup-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="08012345678">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <button type="submit" class="btn-signup" id="signup-btn">Create Account</button>
    </form>

    <div class="auth-link">
      Already have an account? <a href="/HTML/login.html">Login here</a>
    </div>
  </div>

  <footer><p>&copy; 2026 Mobola Stores. All rights reserved.</p></footer>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorDiv = document.getElementById('error-message');
      const successDiv = document.getElementById('success-message');
      const signupBtn = document.getElementById('signup-btn');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.style.display = 'block';
        return;
      }

      signupBtn.disabled = true;
      signupBtn.textContent = 'Creating Account...';

      try {
        const response = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, phone, password })
        });

        const data = await response.json();

        if (response.ok) {
          successDiv.textContent = 'Account created successfully! Redirecting...';
          successDiv.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/HTML/index.html';
          }, 1500);
        } else {
          errorDiv.textContent = data.error || 'Sign up failed';
          errorDiv.style.display = 'block';
          signupBtn.disabled = false;
          signupBtn.textContent = 'Create Account';
        }
      } catch (error) {
        errorDiv.textContent = 'An error occurred. Please try again.';
        errorDiv.style.display = 'block';
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
