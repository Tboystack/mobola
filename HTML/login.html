<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mobola Store</title>
  <link rel="stylesheet" href="../design/new.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .auth-container h1 {
      text-align: center;
      color: #25d366;
      margin-bottom: 2rem;
      font-size: 1.8rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: #333;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #25d366;
      box-shadow: 0 0 5px rgba(37, 211, 102, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: #25d366;
      padding: 5px;
    }

    .toggle-password:hover {
      color: #128c7e;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-login:hover {
      background-color: #128c7e;
    }

    .btn-login:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .auth-link {
      text-align: center;
      margin-top: 1rem;
      color: #666;
    }

    .auth-link a {
      color: #25d366;
      text-decoration: none;
      font-weight: bold;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #ff4444;
      background-color: #ffe6e6;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message {
      color: #25d366;
      background-color: #e6ffe6;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 1rem;
      display: none;
    }

    .back-link {
      text-align: center;
      margin-bottom: 1rem;
    }

    .back-link a {
      color: #25d366;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav class="nav-right">
    <a href="/index.html">Home</a>
    <a href="/HTML/shop.html">Shop</a>
    <a href="/HTML/contact.html">Contact</a>
  </nav>

  <div class="auth-container">
    <div class="back-link">
      <a href="/index.html">← Back to Home</a>
    </div>

    <h1>🔐 Login</h1>

    <div id="error-message" class="error-message"></div>
    <div id="success-message" class="success-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" required>
          <button type="button" class="toggle-password" id="toggle-password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">Login</button>
    </form>

    <div class="auth-link">
      Don't have an account? <a href="/HTML/signup.html">Sign up here</a>
    </div>
  </div>

  <footer><p>&copy; 2026 Mobola Stores. All rights reserved.</p></footer>

  <script>
    // Toggle password visibility
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁️';
      }
    });

    // Login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const successDiv = document.getElementById('success-message');
      const loginBtn = document.getElementById('login-btn');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          successDiv.textContent = 'Login successful! Redirecting...';
          successDiv.style.display = 'block';
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1500);
        } else {
          errorDiv.textContent = data.error || 'Login failed. Please try again.';
          errorDiv.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorDiv.textContent = 'Connection error. Please check your internet and try again.';
        errorDiv.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
